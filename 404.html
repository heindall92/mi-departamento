<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esta sala no existe · Mi Departamento</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f6ef">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f3f6ef radial-gradient(#d5e5d9 1px, transparent 1.5px) 0 0 / 22px 22px;
      color: #1f2340; font: 1rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { padding: 2rem 1.25rem; text-align: center; max-width: 28rem; }
    p { margin: 0; }
    .code {
      margin: 0; font-weight: 650; font-size: clamp(3rem, 10vw, 4.5rem);
      letter-spacing: -0.04em; line-height: 1; color: #1f2340;
    }
    h1 { margin: 0.6rem 0 0.35rem; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
    .en { color: #4a4f6e; }
    a {
      display: inline-block; margin-top: 1.4rem; padding: 0.7rem 1rem;
      color: #fff; background: #2a7d48; text-decoration: none;
      border-radius: 999px; font-weight: 600; font-size: 0.95rem;
    }
    a:hover { background: #1f5e36; }
    a:active { transform: scale(0.97); }
    a:focus-visible { outline: 2px solid #1f2340; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { a:active { transform: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esta sala no existe.</h1>
    <p class="en">This room is not on the floor.</p>
    <a href="/">Volver a la oficina</a>
  </main>
</body>
</html>
