<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esta sala no existe · Mi Departamento</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14111d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #14111d radial-gradient(#221d31 1px, transparent 1.5px) 0 0 / 24px 24px;
      color: #f5ead6; font: 16px/1.5 system-ui, sans-serif;
    }
    main { padding: 32px 20px; text-align: center; max-width: 36rem; }
    p { margin: 0; }
    .code {
      margin: 0; font-family: "Pixelify Sans", Silkscreen, monospace;
      font-size: clamp(48px, 10vw, 80px); line-height: 1;
      text-shadow: 3px 3px 0 #0F766E, 6px 6px 0 #0b0911;
    }
    h1 { margin: 14px 0 8px; font-size: 1.35rem; font-weight: 650; }
    .en { color: #9d93b3; font-size: 0.95rem; }
    a {
      display: inline-block; margin-top: 22px; padding: 10px 14px;
      color: #f5ead6; background: #0F766E; text-decoration: none;
      font-family: Silkscreen, monospace; font-size: 12px;
    }
    a:hover { background: #0b4f4a; }
    a:focus-visible { outline: 2px dashed #2dd4bf; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esta sala no existe.</h1>
    <p class="en">This room is not on the floor.</p>
    <a href="/">Volver a la oficina</a>
  </main>
</body>
</html>
